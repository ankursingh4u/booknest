name = "BookNest"
client_id = "977216ff65e771c094a5b882f610bb14"
application_url = "https://app.booknestapp.site"
embedded = true

[access_scopes]
scopes = "read_products,write_products,read_publications,write_publications,read_orders,write_orders,read_draft_orders,write_draft_orders,read_customers,write_customers,read_locations"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/cancelled", "orders/paid", "refunds/create"]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/webhooks/compliance"

[auth]
redirect_urls = ["https://app.booknestapp.site/auth/callback"]

[app_proxy]
url = "https://app.booknestapp.site/proxy"
subpath = "booknest"
prefix = "apps"

[build]
automatically_update_urls_on_dev = true
